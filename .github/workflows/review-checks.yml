name: OCE-OPS review checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python -m pip install pypdf==6.10.0
      - name: Refresh the operational baseline
        run: git fetch origin main
      - name: Full browser regression suite
        run: npm test
      - name: Compare report pagination and text
        run: python tests/compare-print.py
      - name: Integrated opt-in Stage A contracts
        run: npm run test:workspaces
      - name: Compare all five report families from three workspace routes
        run: |
          npm run test:workspace-print
          python tests/compare-workspace-print.py
      - name: Capture Stage A using synthetic review data
        run: npm run screenshots:workspaces
      - name: Capture responsive and actual-model evidence
        run: |
          npm run screenshots -- after
          node tests/model-inspection.cjs
      - name: Exercise complete offline repository recovery
        run: |
          node tests/recovery.cjs
          python tests/verify-recovery.py
      - name: Retain review evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: review-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/
          retention-days: 14

  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - run: git fetch origin main
      - name: Firefox browser regression suite (print-media checks; Chromium exports PDFs)
        run: xvfb-run --auto-servernum npm test
        env:
          OCE_ENGINE: firefox
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Firefox integrated opt-in Stage A contracts
        run: xvfb-run --auto-servernum npm run test:workspaces
        env:
          OCE_ENGINE: firefox
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Retain Firefox evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: firefox-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/
          retention-days: 14
